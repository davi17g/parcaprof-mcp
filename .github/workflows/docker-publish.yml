name: Publish Docker image
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag (without leading 'v'). Defaults to the short commit SHA."
        required: false
        default: ""
      tag-latest:
        description: "Also tag as :latest"
        required: false
        default: "false"

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      IMAGE_REPO: davi17g/parcaprof-mcp
      REGISTRY: docker.io
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Login to Docker Hub
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Resolve image tag and version
        id: meta
        env:
          DISPATCH_TAG: ${{ inputs.tag }}
          DISPATCH_LATEST: ${{ inputs.tag-latest }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME}"
            IMAGE_TAG="${GITHUB_REF_NAME#v}"
            TAG_LATEST="true"
          else
            VERSION="$(git describe --tags --always --dirty)"
            IMAGE_TAG="${DISPATCH_TAG:-$(git rev-parse --short HEAD)}"
            TAG_LATEST="${DISPATCH_LATEST:-false}"
          fi
          {
            echo "VERSION=${VERSION}"
            echo "IMAGE_TAG=${IMAGE_TAG}"
            echo "TAG_LATEST=${TAG_LATEST}"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push multi-arch image
        run: |
          make docker-buildx \
            IMAGE_REPO=${{ env.IMAGE_REPO }} \
            IMAGE_TAG=${{ steps.meta.outputs.IMAGE_TAG }} \
            IMAGE_TAG_LATEST=${{ steps.meta.outputs.TAG_LATEST }} \
            REGISTRY=${{ env.REGISTRY }} \
            VERSION=${{ steps.meta.outputs.VERSION }} \
            ARCHS="linux/amd64 linux/arm64" \
            IMAGE_OUTPUT="type=image,push=true"
